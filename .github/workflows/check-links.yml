name: Check links

# Verifies the manufacturer PDFs and update sources the app relies on.
# Runs on Linux (cheap) — weekly, when the lists change, or by hand.
on:
  schedule:
    - cron: "17 9 * * 1"
  push:
    paths:
      - "CodeShelf/Resources/FuelCatalog.json"
      - "CodeShelf/Services/UpdatesStore.swift"
      - "CodeShelf/Services/Ontario.swift"
      - "CodeShelf/Services/FuelPrices.swift"
      - "Tests/check_links.py"
      - ".github/workflows/check-links.yml"
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional: space-separated URLs to test instead of the built-in lists"
        required: false
        default: ""

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check links
        env:
          CANDIDATES: ${{ inputs.urls }}
        run: python3 Tests/check_links.py $CANDIDATES
