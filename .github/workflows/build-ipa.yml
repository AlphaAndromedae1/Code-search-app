name: Build IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac to build on (Apple-silicon machines are sometimes short on capacity)"
        type: choice
        default: macos-26-intel
        options:
          - macos-26-intel
          - macos-latest
          - macos-15

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CodeShelf.xcodeproj \
            -scheme CodeShelf \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/CodeShelf.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CodeShelf.app Payload/
          zip -qry CodeShelf.ipa Payload
          ls -lh CodeShelf.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeShelf-ipa
          path: CodeShelf.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

  # Runs the Debug build on an iPhone simulator, imports two sample PDFs and checks
  # that importing, categorizing, indexing and search work on real iOS.
  simulator-smoke-test:
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot an iPhone simulator
        run: |
          UDID=$(python3 Tests/pick_simulator.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for the simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project CodeShelf.xcodeproj \
            -scheme CodeShelf \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee sim-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/CodeShelf.app

      - name: Install, launch and import sample PDFs
        run: |
          BUNDLE=com.personal.codeshelf
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/CodeShelf.app
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          mkdir -p "$DATA/tmp/fixtures"
          cp Tests/Fixtures/*.pdf "$DATA/tmp/fixtures/"
          F="$DATA/tmp/fixtures"
          xcrun simctl launch "$UDID" "$BUNDLE" -importOnLaunch "$F/OESC 2024 sample.pdf|$F/2-7-26.pdf|$F/CSA B139-24 Installation code for oil-burning equipment.pdf|$F/Acme AF100 Furnace Installation Instructions.pdf"

      - name: Verify import, indexing and search
        run: python3 Tests/smoke_check.py "$DATA/Library/Application Support/CodeShelf"

      - name: Relaunch (reloads the saved library) and confirm it stays running
        run: |
          xcrun simctl terminate "$UDID" com.personal.codeshelf || true
          xcrun simctl launch "$UDID" com.personal.codeshelf
          sleep 15
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.personal.codeshelf"; then
            echo "CodeShelf is running after relaunch"
          else
            echo "::error::CodeShelf is not running after relaunch"
            exit 1
          fi

      - name: Screenshot
        if: always()
        run: xcrun simctl io "$UDID" screenshot simulator-library.png || true

      - name: Crash reports
        if: failure()
        run: find ~/Library/Logs/DiagnosticReports -name 'CodeShelf*' -mmin -60 -exec cat {} \; 2>/dev/null | head -200 || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: simulator-library.png
          if-no-files-found: ignore
