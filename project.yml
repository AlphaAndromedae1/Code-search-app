# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: CodeShelf
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CodeShelf:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeShelf
    settings:
      base:
        PRODUCT_NAME: CodeShelf
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.codeshelf
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  CodeShelf:
    build:
      targets:
        CodeShelf: all
    run:
      config: Debug
    archive:
      config: Release
